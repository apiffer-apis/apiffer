server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name apiffer.ml;
    root /var/www/html;
    index index.html;

    location ^~ /cool-cat-apiffer/ {
        proxy_pass http://localhost:1240/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80 ;
    listen [::]:80;

    server_name api.apiffer.ml;
    root /var/www/html;
    index index.html;

    location / {
        proxy_pass http://localhost:1269;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    if ($host = 'apiffer.ml') {
        return 301 https://$host$request_uri;
    }
    listen 80 ;
    listen [::]:80 ;
    server_name apiffer.ml;
    return 404;
}
server {
    if ($host = 'api.apiffer.ml') {
        return 301 https://$host$request_uri;
    }
    listen 80 ;
    listen [::]:80 ;
    server_name api.apiffer.ml;
    return 404;
}