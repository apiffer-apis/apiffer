upstream website {
    server apps:3000;
}

upstream api {
    server apps:1269;
}

upstream proxys{
    server apps:1240;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    # listen 443 ssl;
    listen 80 default_server;
    server_name apiffer.ml;

    # ssl_certificate /ssl/<your_ssl_cert.pem>;
    # ssl_certificate_key /ssl/<your_ssl_private_key.key>;

    access_log /var/log/nginx/data-access.log combined;


    location ^~ /cool-cat-apiffer/ {
      proxy_pass http://proxys/;
  }

    location / {
        proxy_pass http://website/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect http://website/ $scheme://$http_host/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 20d;
        proxy_buffering off;
    }
}

server {
    listen 80;
    server_name api.apiffer.ml;
    access_log /var/log/nginx/data-access.log combined;

    location / {
        proxy_pass http://api/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect http://api/ $scheme://$http_host/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 20d;
        proxy_buffering off;
    }
}